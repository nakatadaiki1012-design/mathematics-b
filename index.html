<!DOCTYPE html>
<html lang="ja">
<head>

<title>数学Bラボ</title>
<meta name="description" content="数学Bの数列・統計的な推測を、図を動かして見てわかるアプリ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 見た目：数学Aラボとそろえた方眼ノート（紙・墨・緑青・朱） */
:root {
  --bg: #f1ede4; --panel: #fbf9f4; --ink: #24282b; --muted: #6d6b63; --line: #d6d0c2; --chip: #ebe6da;
  --accent: #2c6352; --accent-ink: #fbf9f4; --accent-soft: rgba(44, 99, 82, .16);
  --warm: #b8502c; --warm-soft: rgba(184, 80, 44, .16);
  --blue: #2f5f9e; --blue-soft: rgba(47, 95, 158, .16);
  --gold: #b88a12; --gold-soft: rgba(184, 138, 18, .18); --violet: #7a4fa3;
  --stage-1: #fdfcf8; --stage-2: #ece7dc; --grid: rgba(36, 40, 43, .06);
  --ok: #2c7a4f; --ng: #b8402c;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-data: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  --r: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18201c; --panel: #1f2924; --ink: #ebe8dd; --muted: #a3a89b; --line: #36443c; --chip: #28342e;
    --accent: #8cc5a6; --accent-ink: #18201c; --accent-soft: rgba(140, 197, 166, .2);
    --warm: #eda26b; --warm-soft: rgba(237, 162, 107, .2);
    --blue: #8fb5e8; --blue-soft: rgba(143, 181, 232, .2);
    --gold: #e3c15a; --gold-soft: rgba(227, 193, 90, .2); --violet: #c3a3e6;
    --stage-1: #26332d; --stage-2: #141b17; --grid: rgba(235, 232, 221, .06);
    --ok: #8cd4a6; --ng: #f09a7a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18201c; --panel: #1f2924; --ink: #ebe8dd; --muted: #a3a89b; --line: #36443c; --chip: #28342e;
  --accent: #8cc5a6; --accent-ink: #18201c; --accent-soft: rgba(140, 197, 166, .2);
  --warm: #eda26b; --warm-soft: rgba(237, 162, 107, .2);
  --blue: #8fb5e8; --blue-soft: rgba(143, 181, 232, .2);
  --gold: #e3c15a; --gold-soft: rgba(227, 193, 90, .2); --violet: #c3a3e6;
  --stage-1: #26332d; --stage-2: #141b17; --grid: rgba(235, 232, 221, .06);
  --ok: #8cd4a6; --ng: #f09a7a;
  color-scheme: dark;
}
html.fz1 { font-size: 17px; } html.fz2 { font-size: 19px; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.6;
  height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
sub, sup { font-size: .76em; line-height: 0; }

/* 上のバー：分野 */
.top {
  flex: none; display: flex; align-items: center; gap: 14px;
  padding: 7px max(14px, env(safe-area-inset-right, 0px)) 7px max(14px, env(safe-area-inset-left, 0px));
  border-bottom: 1.5px solid var(--ink); background: var(--panel);
}
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; letter-spacing: .04em; margin: 0; white-space: nowrap; }
.brand b { color: var(--warm); }
.secnav { display: flex; gap: 2px; min-width: 0; flex: 1; }
.secnav button { border: 0; background: transparent; padding: 5px 12px; font-size: .95rem; color: var(--muted); white-space: nowrap; font-weight: 700; }
.secnav button:hover { color: var(--ink); }
.secnav .short { display: none; }
.secnav button[aria-current="true"] { color: var(--ink); box-shadow: inset 0 -2.5px 0 var(--warm); }
.tools { display: flex; gap: 4px; }
.tbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 3px 9px; font-size: .85rem; font-weight: 700; }
.tbtn:hover { border-color: var(--ink); }

/* 単元の列（横にならぶ） */
.units {
  flex: none; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  padding: 8px max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px));
}
.units::-webkit-scrollbar { display: none; }
.uchip { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 4px 11px 5px; text-align: left; line-height: 1.25; }
.uchip:hover { border-color: var(--ink); }
.uchip b { display: block; font-size: .9rem; }
.uchip .num { font-family: var(--font-data); color: var(--warm); font-size: .75rem; margin-right: 5px; }
.uchip .pips { display: flex; gap: 3px; margin-top: 3px; }
.uchip .pips i { width: 14px; height: 4px; border-radius: 2px; background: var(--line); }
.uchip .pips i.on { background: var(--accent); }
.uchip[aria-current="true"] { border-color: var(--ink); box-shadow: 2px 2px 0 var(--ink); }
.uchip.clear b::after { content: " ✓"; color: var(--accent); }

/* 全体の配置：左にステージ（図）、右に説明 */
.app {
  flex: 1; min-height: 0; display: grid; gap: 10px;
  grid-template-columns: minmax(0, 1fr) 370px;
  padding: 8px max(14px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
}
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }

/* ステージ */
.stage-wrap {
  position: relative; border-radius: var(--r); overflow: hidden; min-height: 0; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 40% 35%, var(--stage-1), var(--stage-2));
  display: flex; flex-direction: column;
}
.fband { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--panel); border-bottom: 1.5px solid var(--ink); min-height: 50px; }
.fbody { flex: 1; min-width: 0; }
.fgen { font-size: 1.25rem; line-height: 1.45; font-weight: 600; font-family: var(--font-data); }
.fgen .k { font-family: var(--font-body); font-size: .72rem; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; margin-right: 10px; vertical-align: 3px; font-weight: 500; }
.fnow { font-family: var(--font-data); font-size: 1.05rem; line-height: 1.5; margin-top: 2px; }
.fnow:empty { display: none; }
.stage-area { position: relative; flex: 1; min-height: 0; }
.stage { position: absolute; inset: 0; }
.stage-hint {
  position: absolute; left: 10px; top: 8px; font-size: .8rem; color: var(--ink); background: var(--panel);
  border: 1px solid var(--warm); border-radius: 3px; padding: 2px 8px; pointer-events: none; z-index: 2; max-width: calc(100% - 20px); font-weight: 700;
}
.stage-hint:empty { display: none; }
.stage-hint::before { content: "👆 "; }

/* 説明パネル */
.card { display: flex; flex-direction: column; overflow: hidden; }
.stepper { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.stepper button { border: 0; background: transparent; padding: 8px 2px 7px; font-weight: 700; font-size: .9rem; color: var(--muted); position: relative; }
.stepper button + button::before { content: ""; position: absolute; left: 0; top: 30%; height: 40%; border-left: 1px solid var(--line); }
.stepper button[aria-current="true"] { color: var(--ink); box-shadow: inset 0 -3px 0 var(--warm); }
.stepper button.done::after { content: "✓"; color: var(--accent); margin-left: 3px; }
.card-body { flex: 1; min-height: 0; overflow: auto; padding: 12px 16px 10px; display: flex; flex-direction: column; gap: 10px; }
.ptitle { display: flex; align-items: baseline; gap: 8px; }
.ptitle .tag { font-size: .72rem; border: 1px solid var(--ink); border-radius: 3px; padding: 0 6px; font-weight: 700; white-space: nowrap; }
.ptitle h2 { font-family: var(--font-display); font-size: 1.25rem; margin: 0; line-height: 1.3; }
.prob { border: 1.5px solid var(--ink); border-radius: 3px; padding: 8px 11px; background: var(--bg); font-size: .95rem; line-height: 1.65; }
.prob b { color: var(--warm); }
.say { font-size: 1.02rem; line-height: 1.7; }
.say b { color: var(--warm); }
.say .eq, .eq { font-family: var(--font-data); }
.lead { font-size: .95rem; line-height: 1.65; margin: 0; }
.lead b { color: var(--warm); }
.dots { display: flex; gap: 5px; align-items: center; font-size: .82rem; color: var(--muted); }
.dots i { width: 10px; height: 10px; }
/* 数学Aラボと同じ 初学者向けのしかけ */
.ptitle .role { margin-left: auto; font-size: .72rem; color: var(--muted); white-space: nowrap; }
.goal { color: var(--accent); font-weight: 700; font-size: .9rem; line-height: 1.5; border-left: 3px solid var(--accent); padding-left: 8px; }
.resume { color: var(--accent); font-size: .8rem; }
.trysay { margin: 0; color: var(--warm); font-weight: 700; font-size: .85rem; }
.whyng { display: inline; font-weight: 500; color: var(--ink); }
.result.whyng { display: block; border-left: 3px solid var(--warm); padding: 4px 8px; background: var(--warm-soft); border-radius: 0 4px 4px 0; font-size: .9rem; }
.mini.more { border-style: dashed; border-color: var(--accent); }
.sdlg { max-height: 86vh; overflow: auto; }
.flow { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 6px; font-size: .92rem; line-height: 1.6; }
.flow .calc { font-family: var(--font-data); background: var(--chip); border-radius: 4px; padding: 3px 8px; margin-top: 2px; }
.flow.welcome li::marker { color: var(--warm); font-weight: 800; }
.miss { border: 1.5px solid var(--warm); border-radius: 5px; padding: 6px 10px; font-size: .9rem; }
.miss b { color: var(--warm); } .miss ul { margin: 4px 0 0; padding-left: 1.2em; } .miss li { margin-bottom: 3px; }
.miss .mono { font-family: var(--font-data); font-weight: 600; }
@media (max-width: 860px) { .ptitle .role, .trysay { display: none; } .goal { font-size: .78rem; line-height: 1.4; } .card .readout { font-size: .8rem; padding: 4px 8px; } }
/* 用語（タップで意味） */
.term { border-bottom: 2px dotted var(--gold); cursor: help; }
.gpop { position: fixed; z-index: 80; max-width: min(320px, 90vw); background: var(--panel); border: 1.5px solid var(--ink); border-radius: 6px; box-shadow: 3px 3px 0 var(--ink); padding: 8px 12px; font-size: .88rem; line-height: 1.55; animation: fadein .15s; }
.gpop b { display: block; color: var(--gold); font-size: .95rem; margin-bottom: 2px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--warm); }
.dots i.done { background: var(--accent); }
.ctrl { display: flex; flex-direction: column; gap: 6px; }
.ctrl label.sl { display: grid; grid-template-columns: 5.5em 1fr 3.4em; gap: 8px; align-items: center; font-size: .9rem; }
.ctrl label.sl output { font-family: var(--font-data); font-weight: 600; text-align: right; }
.ctrl input[type="range"] { width: 100%; accent-color: var(--warm); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 4px 10px; font-size: .85rem; font-weight: 500; }
.seg button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--panel); font-weight: 700; }
.readout { border: 1px dashed var(--line); border-radius: 4px; padding: 6px 10px; font-size: .92rem; line-height: 1.6; background: var(--bg); }
.readout b { color: var(--warm); }
.pts { margin: 0; padding-left: 1.1em; font-size: .9rem; line-height: 1.55; color: var(--ink); }
.pts li { margin-bottom: 2px; }
.pts b { color: var(--warm); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.choice { border: 1.5px solid var(--ink); background: var(--panel); border-radius: 5px; padding: 9px 8px; font-family: var(--font-data); font-weight: 600; font-size: 1.02rem; box-shadow: 2px 2px 0 var(--ink); line-height: 1.35; }
.choice:hover:not(:disabled) { background: var(--chip); }
.choice:active:not(:disabled) { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
.choice.ok { background: var(--accent); color: var(--accent-ink); }
.choice.ng { background: var(--warm-soft); text-decoration: line-through; opacity: .7; }
.choice:disabled { opacity: 1; cursor: default; }
.choices.txt .choice { font-family: var(--font-body); font-size: .9rem; text-align: left; }
.choices.one { grid-template-columns: 1fr; }
.choice.ans { display: inline-block; padding: 2px 10px; box-shadow: none; font-size: .92rem; }
.minirow { display: flex; gap: 6px; flex-wrap: wrap; }
.mini { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 3px 10px; font-size: .85rem; font-weight: 700; }
.mini:hover { border-color: var(--ink); }
.hintbox { border-left: 3px solid var(--gold); background: var(--gold-soft); padding: 6px 10px; font-size: .9rem; border-radius: 0 4px 4px 0; }
.result { font-weight: 700; font-size: 1rem; }
.result.ok { color: var(--ok); } .result.ng { color: var(--ng); }
.summary { border: 1.5px solid var(--accent); border-radius: 5px; padding: 8px 12px; background: var(--accent-soft); }
.summary h3 { margin: 0 0 4px; font-family: var(--font-display); font-size: 1.05rem; }
.stamp { display: inline-block; font-family: var(--font-display); font-weight: 800; color: var(--warm); border: 2.5px solid var(--warm); border-radius: 50%; padding: 6px 10px; transform: rotate(-12deg); font-size: 1rem; }
.card-foot { flex: none; display: flex; gap: 8px; padding: 9px 12px; border-top: 1px solid var(--line); }
.btn { border: 1px solid var(--ink); background: var(--panel); border-radius: 5px; padding: 8px 14px; font-size: .95rem; font-weight: 700; }
.btn:hover:not(:disabled) { background: var(--chip); }
.btn.main { flex: 1; background: var(--accent); color: var(--accent-ink); box-shadow: 2px 2px 0 var(--ink); }
.btn.main:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
.btn.main.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 2px 2px 0 var(--ink), 0 0 0 5px var(--accent-soft); } }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.1; font-family: var(--font-data); margin: 0 2px; font-size: .92em; }
.fr > i { font-style: normal; padding: 0 3px; }
.fr > i:first-child { border-bottom: 1.5px solid currentColor; }
.cw { color: var(--warm); } .ca { color: var(--accent); } .cb { color: var(--blue); } .cv { color: var(--violet); } .cg { color: var(--gold); }
.sg { font-size: 1.25em; vertical-align: -2px; }

/* ステージの SVG */
.sv { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.sv text { font-family: var(--font-body); fill: var(--ink); font-size: 15px; }
.sv .mono { font-family: var(--font-data); }
.sv .disp { font-family: var(--font-display); font-weight: 800; }
.sv .mut { fill: var(--muted); }
.sv .tw { fill: var(--warm); } .sv .ta { fill: var(--accent); } .sv .tb { fill: var(--blue); } .sv .tg { fill: var(--gold); } .sv .tv { fill: var(--violet); } .sv .tp { fill: var(--panel); }
.sv .b { font-weight: 700; }
.ink { stroke: var(--ink); fill: none; stroke-width: 2; }
.thin { stroke: var(--muted); fill: none; stroke-width: 1.2; }
.dash { stroke-dasharray: 6 5; }
.s-ac { stroke: var(--accent); } .s-wm { stroke: var(--warm); } .s-bl { stroke: var(--blue); } .s-gd { stroke: var(--gold); } .s-vi { stroke: var(--violet); } .s-ink { stroke: var(--ink); } .s-mut { stroke: var(--muted); } .s-ln { stroke: var(--line); } .s-pn { stroke: var(--panel); }
.f-ac { fill: var(--accent); } .f-wm { fill: var(--warm); } .f-bl { fill: var(--blue); } .f-gd { fill: var(--gold); } .f-vi { fill: var(--violet); }
.f-acs { fill: var(--accent-soft); } .f-wms { fill: var(--warm-soft); } .f-bls { fill: var(--blue-soft); } .f-gds { fill: var(--gold-soft); }
.f-pn { fill: var(--panel); } .f-ink { fill: var(--ink); } .f-chip { fill: var(--chip); } .f-none { fill: none; } .f-bg { fill: var(--bg); } .f-ln { fill: var(--line); }
.ghost { opacity: .35; }
.pop { animation: pop .45s cubic-bezier(.3, 1.4, .5, 1) both; transform-box: fill-box; transform-origin: center bottom; }
@keyframes pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
.fadein { animation: fadein .5s ease-out both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.grow { animation: grow .6s ease-out both; transform-box: fill-box; transform-origin: center bottom; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.draw { stroke-dasharray: 2000; animation: draw 1.1s ease-out both; }
@keyframes draw { from { stroke-dashoffset: 2000; } to { stroke-dashoffset: 0; } }
.drag { cursor: ns-resize; }
.domino { transition: transform .35s cubic-bezier(.5, 0, .9, .5); transform-box: fill-box; transform-origin: right bottom; }
.domino.fall { transform: rotate(68deg); }
.domino.stop { transform: rotate(0deg); }
.halo { animation: halo 1.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes halo { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(1.8); } }

/* スマホ・たて長：上に図、下に説明 */
@media (max-width: 860px) {
  .top { gap: 8px; }
  .brand { font-size: 1.05rem; }
  .secnav button { padding: 5px 7px; font-size: .85rem; }
  .secnav .long { display: none; } .secnav .short { display: inline; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; gap: 8px; }
  .card { max-height: 58dvh; }
  .ipts { display: none; }
  .choices.txt .choice { padding: 6px 8px; font-size: .85rem; }
  .prob { padding: 6px 9px; font-size: .88rem; line-height: 1.55; }
  .fband { min-height: 0; padding: 6px 10px; }
  .fgen { font-size: 1rem; }
  .fnow { font-size: .9rem; }
  .card-body { padding: 9px 12px 8px; gap: 8px; }
  .say { font-size: .95rem; }
  .ptitle h2 { font-size: 1.05rem; }
  .choice { padding: 7px 6px; font-size: .9rem; }
}
@media (max-width: 860px) and (max-height: 700px) {
  .lead, .pts { font-size: .85rem; }
}
/* 等差数列の和・等比数列の和：上から落ちてくる */
.drop { animation: drop .6s cubic-bezier(.3, 1.3, .5, 1) both; }
@keyframes drop { from { opacity: 0; transform: translateY(-60px); } to { opacity: 1; transform: none; } }
/* ドミノがたおれる */
@keyframes fallA { from { transform: rotate(0deg); } to { transform: rotate(var(--ang)); } }

/* --- v2：レベル・演習・先生モード・式の流れ --- */
.tbtn.lv { border-color: var(--accent); font-weight: 700; }
.tbtn.sm { padding: 3px 6px; }
.lvmenu { position: absolute; z-index: 30; top: 44px; right: 14px; background: var(--panel); border: 1.5px solid var(--ink); border-radius: 6px; box-shadow: 3px 3px 0 var(--ink); padding: 6px; display: flex; flex-direction: column; gap: 2px; min-width: 240px; }
.lvmenu button { border: 1px solid transparent; background: transparent; border-radius: 4px; padding: 6px 10px; text-align: left; display: grid; grid-template-columns: 26px 1fr; gap: 6px; align-items: center; }
.lvmenu button:hover { background: var(--chip); }
.lvmenu button[aria-pressed="true"] { border-color: var(--ink); background: var(--accent-soft); }
.lvmenu b { display: block; font-size: .95rem; } .lvmenu small { display: block; color: var(--muted); font-size: .75rem; line-height: 1.3; }
.stepper { grid-template-columns: repeat(5, 1fr); }
.stepper button { font-size: .85rem; padding: 8px 0 7px; }
.fnow .eqline { line-height: 1.5; }
.fnow .eqline.old { opacity: .45; font-size: .85em; }
.fnow .eqline.cur { padding-left: 8px; border-left: 3px solid var(--warm); }
.fnow .hidden-ans { color: var(--muted); font-family: var(--font-body); font-size: .85rem; }
.uchip .pips i.half { background: var(--gold); }

/* --- 等比数列の和：S と rS をずらしてならべ、引くと消える --- */
function gsumViz(svg, p, k, box) {
  const { W, H } = box, g = s("g", {}, svg);
  const lv = box.intro && p.show != null ? p.show : k >= 99 ? 3 : k;
  const n = p.n, a = p.a, r = p.r, t = range(0, n).map(i => a * r ** i);
  const cols = p.mode === "cum" ? n : n + 1;
  const cw = Math.min(92, (W - 130) / cols), x0 = Math.max(96, (W - cols * cw) / 2 + 30), th = clamp(H * .11, 40, 58);
  const yS = Math.max(96, H * .26), yR = yS + th + 54;
  const tfs = v => clamp(Math.min(cw * .86 / (String(v).length * .62), 19), 9, 19);
  const tile = (i, y, v, cls, tcls, extra) => {
    const gg = s("g", { class: extra || "" }, g);
    s("rect", { x: x0 + i * cw + 3, y, width: cw - 6, height: th, rx: 4, class: cls, "stroke-width": 1.8 }, gg);
    T(gg, x0 + i * cw + cw / 2, y + th / 2 + tfs(v) / 3, String(v), "mono b " + tcls, tfs(v));
    return gg;
  };
  T(g, x0 - 16, yS + th / 2 + 8, "S", "disp", 24, "end");
  for (let i = 0; i < n; i++) {
    const gone = lv >= 2 && p.mode !== "cum" && i > 0;
    tile(i, yS, t[i], gone ? "f-chip s-ln" : i === 0 && lv >= 2 ? "f-wms s-wm" : "f-acs s-ac", gone ? "mut" : "ta", gone ? "" : "");
    if (i > 0) T(g, x0 + i * cw, yS + th / 2 + 6, "+", "b mut", 16);
  }
  if (p.mode === "cum") {
    if (lv >= 1) {
      let c = 0;
      for (let i = 0; i < n; i++) {
        c += t[i];
        const hit = lv >= 2 && c === p.target;
        badge(g, x0 + i * cw + cw / 2, yR + 10, String(c), hit ? "f-wm" : "f-chip", hit ? "tp" : "", clamp(tfs(c), 10, 17)).classList.add(lv === 1 ? "pop" : "x");
        arrow(g, x0 + i * cw + cw / 2, yS + th + 4, x0 + i * cw + cw / 2, yR - 14, "mut", 1.4);
      }
      T(g, x0 - 16, yR + 6, "ここまでの和", "b mut", 14, "end");
    }
    if (lv >= 2) T(g, W / 2, yR + 64, `3ⁿ − 1 = ${p.target}  →  3ⁿ = ${p.target + 1}  →  n = 4`, "mono b tw pop", 18);
    return;
  }
  if (lv >= 1) {
    T(g, x0 - 16, yR + th / 2 + 8, "rS", "disp", 24, "end");
    for (let i = 1; i <= n; i++) {
      const gone = lv >= 2 && i < n;
      tile(i, yR, t[i], gone ? "f-chip s-ln" : i === n && lv >= 2 ? "f-wms s-wm" : "f-bls s-bl", gone ? "mut" : "tb", lv === 1 ? "drop" : "");
      if (lv === 1) arrow(g, x0 + (i - 1) * cw + cw * .6, yS + th + 3, x0 + i * cw + cw * .35, yR - 3, "bl", 1.4, "fadein");
    }
    if (lv === 1) T(g, x0 + cw * .95, yS + th + 30, "×" + r, "mono b tb", 15, "start");
  }
  if (lv >= 2) {
    for (let i = 1; i < n; i++) {
      const cx = x0 + i * cw + cw / 2;
      s("line", { x1: cx - cw * .3, y1: yS + th + 6, x2: cx + cw * .3, y2: yR - 6, class: "s-wm draw", "stroke-width": 2.5 }, g);
      s("line", { x1: cx + cw * .3, y1: yS + th + 6, x2: cx - cw * .3, y2: yR - 6, class: "s-wm draw", "stroke-width": 2.5 }, g);
    }
    if (n > 1) T(g, x0 + (n * cw) / 2 + cw / 2, yR + th + 26, "たてに同じ数 → ひくと消える", "b tw", 15);
    T(g, W / 2, yR + th + 60, `rS − S = ${t[n]} − ${a}`, "mono b", 19);
  }
  if (lv >= 3) {
    const S = a * (r ** n - 1) / (r - 1);
    badge(g, W / 2, yR + th + 98, r === 2 ? `S = ${t[n]} − ${a} = ${S}` : `(${r} − 1)S = ${t[n] - a}  →  S = ${S}`, "f-ac", "tp", 17).classList.add("pop");
  }
}

  }
  draw();
}

/* ---------- 画面のつなぎ ---------- */
function leaveAll() {

/* ゲーム中のステージ：問題の図（ヒント状態）／先生はランキング／トップは段位 */
function drawGame(svg, W, H) {

  if (S.game.view === "battle" && BT && BT.room && BT.played) { const lst = playersOf(BT.room, BT.room.round), my = lst.findIndex(p => p.id === pid()); if (my >= 0) { T(g, W / 2, H / 2 - 16, `${my + 1} 位`, "disp " + (my < 3 ? "ta" : "tw"), 80); T(g, W / 2, H / 2 + 40, `${lst.length} 人中`, "b", 20); return true; } }
  T(g, W / 2, 70, "🪙 ごほうび", "b mut", 16);
  T(g, W / 2, 128, rk.name, "disp tw", 54);
  s("rect", { x: W / 2 - 150, y: 150, width: 300, height: 12, rx: 6, class: "f-chip s-ln" }, g);
  s("rect", { x: W / 2 - 150, y: 150, width: 300 * pc, height: 12, rx: 6, class: "f-gd" }, g);
  T(g, W / 2, 184, rk.next ? `次の「${rk.nextName}」まで あと ${(rk.next - RW.coins).toLocaleString()} コイン` : "最高の段位です！", "mut", 13);
  T(g, W / 2, 214, `🪙 ${RW.coins.toLocaleString()} コイン　🔥 ${streakNow()} 日連続　🏅 ${Object.keys(RW.badges).length}/${BADGES.length}`, "b", 15);
  const bw = Math.min(110, (W - 60) / BADGES.length), x0 = (W - bw * BADGES.length) / 2;
  BADGES.forEach((b, i) => { const on = RW.badges[b.id], x = x0 + bw * (i + .5); T(g, x, 272, on ? b.ico : "🔒", on ? "" : "ghost", 28); T(g, x, 296, b.name, on ? "b" : "mut", clamp(bw / 7.5, 9, 12)); });
  T(g, W / 2, H - 40, "コイン：演習の正解 +10・合格 +50（はじめて +150）・タイムアタック 20 点で +1・クラス対戦 参加 +20・3 位以内 +50", "mut", clamp(W / 70, 10, 13));
  return true;
}
/* ---------- ⚙ 設定 ---------- */
function openSettings() {

  box.append(seg("文字の大きさ", [[0, "小"], [1, "中"], [2, "大"]], store.get("fz", 0), v => { fz = v; store.set("fz", v); applyFz(); render(); }));

  box.append(h("hr", { class: "sep" }), h("b", {}, "🏆 クラス対戦のデータベース（先生が 1 回だけ）"));
  const inp = h("input", { type: "text", class: "ansin", placeholder: "https://〇〇-default-rtdb.〇〇.firebasedatabase.app", value: store.get("db", "") });
  box.append(h("div", { class: "ansrow" }, inp, h("button", { type: "button", class: "btn", onclick: () => { store.set("db", inp.value.trim().replace(/\/+$/, "")); if (!dbBase()) { toast("https:// で始まる URL を入れてください"); return; } const k = "rooms/ping_" + pid(); api("PUT", k, { t: { ".sv": "timestamp" } }).then(() => api("DELETE", k)).then(() => toast("✅ つながりました"), e => toast(`✕ つながりません（${e.message}）`)); } }, "保存して接続テスト")));
  box.append(h("p", { class: "lead", style: "font-size:.8rem;color:var(--muted)" }, window.MB_CONFIG && MB_CONFIG.db ? "はじめから 論理表現ラボと同じデータベースが設定ずみ（ここが空なら そちらを使います）。" : "作り方は README の「クラス対戦の準備」にあります。", " 生徒は 先生の部屋のリンク・QR から入れば 設定はいりません。"));
  if (!dlg.open) dlg.showModal();

<script>
"use strict";
/* ===== はじめる ===== */
$("#nextBtn").addEventListener("click", next);
$("#prevBtn").addEventListener("click", prev);
document.addEventListener("keydown", e => {

  if (e.key === "ArrowRight") { e.preventDefault(); $("#nextBtn").click(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); $("#prevBtn").click(); }
});
/* レベル */

  LEVELS.forEach((l, i) => lvmenu.append(h("button", { type: "button", "aria-pressed": i === LEVEL ? "true" : "false", onclick: () => { LEVEL = i; store.set("level", i); lvmenu.hidden = true; if (S.mode === "lesson" && kind() === "pr" && !S.solved) goPart(S.pi); else render(); } }, h("span", { style: "font-size:1.2rem" }, l.ico), h("span", {}, h("b", {}, l.name), h("small", {}, l.tip)))));

/* 文字の大きさ・明るさ（⚙ 設定から） */
const FZ = ["", "fz1", "fz2"];
let fz = store.get("fz", 0);
const applyFz = () => { document.documentElement.classList.remove("fz1", "fz2"); if (FZ[fz]) document.documentElement.classList.add(FZ[fz]); };
applyFz();
const th = store.get("theme", null);
if (th) document.documentElement.dataset.theme = th;
document.addEventListener("keydown", e => { if (!G || G.over || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName || "")) return; if (/^[1-4]$/.test(e.key) && G.q && gnow() >= G.startAt) { const b = document.querySelectorAll("#gq .choice")[+e.key - 1]; if (b) b.click(); } });
/* ✏️ 図に書きこむ（先生用） */
{
  const cv = $("#ink"), bar = $("#penbar"), btn = $("#penBtn"), ctx = cv.getContext("2d");
  let color = "#e0352a", drawing = false, last = null;
  const fit = () => { const r = cv.getBoundingClientRect(); if (cv.width !== Math.round(r.width * devicePixelRatio)) { cv.width = Math.round(r.width * devicePixelRatio); cv.height = Math.round(r.height * devicePixelRatio); ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); } };
  const setOn = on => { cv.hidden = !on; bar.hidden = !on; btn.setAttribute("aria-pressed", on ? "true" : "false"); if (on) fit(); };
  btn.addEventListener("click", () => setOn(cv.hidden));
  $("#penOff").addEventListener("click", () => setOn(false));
  $("#penClear").addEventListener("click", () => ctx.clearRect(0, 0, cv.width, cv.height));
  bar.querySelectorAll("button[data-c]").forEach(b => b.addEventListener("click", () => { color = b.dataset.c; bar.querySelectorAll("button[data-c]").forEach(x => x.classList.toggle("on", x === b)); }));
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener("pointerdown", e => { drawing = true; last = pt(e); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => { if (!drawing) return; const p = pt(e); ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; });
  cv.addEventListener("pointerup", () => (drawing = false)); cv.addEventListener("pointercancel", () => (drawing = false));
  window.addEventListener("resize", () => { if (!cv.hidden) fit(); });
}
/* 印刷用に問題文をコピー */
window.addEventListener("beforeprint", () => { const pr = $("#body .prob"); $("#printProb").innerHTML = (pr ? pr.innerHTML : "") + (S.inst && S.inst.title ? ` <small>（${S.u.name}：${S.inst.title}）</small>` : ""); });
let rsT;
new ResizeObserver(() => { clearTimeout(rsT); rsT = setTimeout(draw, 60); }).observe($("#stage"));
/* URL から画面をひらく：#u-arith/2 ・ #mk/u-arith?a=3&d=4&n=10 ・ #rec ・ #game ・ #join=1234 ・ #host/1234 ・ #battle/1234 */
function openHash() {
  const hs = location.hash.slice(1);
  if (!S.u) { S.u = UNITS.find(u => u.id === store.get("last", UNITS[0].id)) || UNITS[0]; }
  let m;
  if (hs === "game") { if (!(S.mode === "game" && S.game.view === "hub")) openGame(); return true; }
  if (hs === "ta") { if (!(G && G.mode === "solo" && !G.over)) { openGame(); startSolo(); } return true; }
  if ((m = hs.match(/^join(?:=(\d*))?(?:&db=(.+))?$/))) { openJoin(m[1] || "", m[2] ? decodeURIComponent(m[2]) : ""); return true; }
  if ((m = hs.match(/^host\/(\d{4})$/))) { if (!dbBase()) { openGame(); return true; } if (!(HO && HO.code === m[1])) openHost(m[1]); return true; }
  if ((m = hs.match(/^battle\/(\d{4})$/))) { if (!dbBase()) { openGame(); return true; } if (!(BT && BT.code === m[1])) openBattle(m[1]); return true; }
  if (hs === "rec") { renderUnits(); if (S.mode !== "rec") openRecord(); return true; }
  if (hs.startsWith("mk/")) { const [id, q] = hs.slice(3).split("?"); const u = UNITS.find(x => x.id === id); if (!u) return false; S.u = u; renderUnits(); openMaker(q ? new URLSearchParams(q) : null); return true; }
  const [id, pi] = hs.split("/");
  if (!UNITS.some(u => u.id === id)) return false;
  if (S.inst && S.u && id === S.u.id && S.mode === "lesson" && +pi === S.pi) return true;
  openUnit(id, pi == null || pi === "" ? null : +pi); return true;
}
